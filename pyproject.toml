[project]
name = "levagent"
version = "0.1.0"
description = "Tác nhân giao dịch đòn bẩy tiền điện tử, mặc định chạy giả lập"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
levagent = "levagent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["levagent*"]
